<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAÐØW Network | Community</title>
    <meta name="theme-color" content="#070b14" />
    <link rel="manifest" href="pwa/manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body class="app-body">
    <div class="app-layout">
      <aside class="sidebar glass-panel">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div>
            <div class="brand-name">SHAÐØW</div>
            <div class="brand-subtitle">Network</div>
          </div>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
          <a class="nav-item" href="app.html"><span>🏠</span><span>HOME</span></a>
          <a class="nav-item" href="messages.html"><span>💬</span><span>MESSAGES</span></a>
          <a class="nav-item" href="files.html"><span>📁</span><span>MY FILES</span></a>
          <a class="nav-item active" href="community.html"><span>🌐</span><span>COMMUNITY</span></a>
          <a class="nav-item" href="friends.html"><span>👥</span><span>FRIENDS</span></a>
          <a class="nav-item" href="settings.html"><span>⚙️</span><span>SETTINGS</span></a>
        </nav>
      </aside>

      <main class="app-main">
        <header class="topbar app-topbar">
          <div>
            <span class="eyebrow small">Shared library</span>
            <h2>Community</h2>
          </div>
          <div class="top-actions">
            <button class="button secondary" id="community-upload-btn">Upload</button>
          </div>
        </header>

        <div class="toolbar glass-panel">
          <div class="search-box">
            <input type="search" id="community-search" placeholder="Search community files…" />
          </div>
          <div class="category-pills">
            <button class="active">All</button>
            <button>Images</button>
            <button>Videos</button>
            <button>Documents</button>
            <button>Gaming</button>
          </div>
        </div>

        <section class="glass-panel file-panel">
          <div class="panel-header">
            <h3>Authenticated community files</h3>
            <span class="badge success">Members only</span>
          </div>
          <div id="community-grid" class="file-grid"></div>
        </section>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="app.html" class="mobile-item">🏠</a>
      <a href="messages.html" class="mobile-item">💬</a>
      <a href="files.html" class="mobile-item">📁</a>
      <a href="community.html" class="mobile-item active">🌐</a>
      <a href="settings.html" class="mobile-item">⚙️</a>
    </nav>

    <div id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.AppShell) {
          window.AppShell.initCommunity();
        }
      });
    </script>
  </body>
</html>

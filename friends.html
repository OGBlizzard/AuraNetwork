<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAÐØW Network | Friends</title>
    <meta name="theme-color" content="#070b14" />
    <link rel="manifest" href="pwa/manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body class="app-body">
    <div class="app-layout">
      <aside class="sidebar glass-panel">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div>
            <div class="brand-name">SHAÐØW</div>
            <div class="brand-subtitle">Network</div>
          </div>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
          <a class="nav-item" href="app.html"><span>🏠</span><span>HOME</span></a>
          <a class="nav-item" href="messages.html"><span>💬</span><span>MESSAGES</span></a>
          <a class="nav-item" href="files.html"><span>📁</span><span>MY FILES</span></a>
          <a class="nav-item" href="community.html"><span>🌐</span><span>COMMUNITY</span></a>
          <a class="nav-item active" href="friends.html"><span>👥</span><span>FRIENDS</span></a>
          <a class="nav-item" href="settings.html"><span>⚙️</span><span>SETTINGS</span></a>
        </nav>
      </aside>

      <main class="app-main">
        <header class="topbar app-topbar">
          <div>
            <span class="eyebrow small">Trusted circle</span>
            <h2>Friends</h2>
          </div>
          <div class="top-actions">
            <button class="button secondary" id="send-request-btn">Add friend</button>
          </div>
        </header>

        <div class="friends-layout">
          <section class="glass-panel form-panel">
            <h3>Search for friends</h3>
            <div class="search-box small-box">
              <input id="friend-search" type="search" placeholder="Search by username or email" />
            </div>
            <div id="friend-search-results" class="result-list"></div>
          </section>

          <section class="glass-panel form-panel">
            <h3>Friend requests</h3>
            <div id="friend-request-list" class="result-list"></div>
          </section>
        </div>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="app.html" class="mobile-item">🏠</a>
      <a href="messages.html" class="mobile-item">💬</a>
      <a href="files.html" class="mobile-item">📁</a>
      <a href="community.html" class="mobile-item">🌐</a>
      <a href="friends.html" class="mobile-item active">👥</a>
    </nav>

    <div id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/friends.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.FriendManager) {
          window.FriendManager.init();
        }
      });
    </script>
  </body>
</html>

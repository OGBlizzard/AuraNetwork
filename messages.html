<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAÐØW Network | Messages</title>
    <meta name="theme-color" content="#070b14" />
    <link rel="manifest" href="pwa/manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body class="app-body">
    <div class="app-layout">
      <aside class="sidebar glass-panel">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div>
            <div class="brand-name">SHAÐØW</div>
            <div class="brand-subtitle">Network</div>
          </div>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
          <a class="nav-item" href="app.html"><span>🏠</span><span>HOME</span></a>
          <a class="nav-item active" href="messages.html"><span>💬</span><span>MESSAGES</span></a>
          <a class="nav-item" href="files.html"><span>📁</span><span>MY FILES</span></a>
          <a class="nav-item" href="community.html"><span>🌐</span><span>COMMUNITY</span></a>
          <a class="nav-item" href="friends.html"><span>👥</span><span>FRIENDS</span></a>
          <a class="nav-item" href="settings.html"><span>⚙️</span><span>SETTINGS</span></a>
        </nav>
      </aside>

      <main class="app-main">
        <header class="topbar app-topbar">
          <div>
            <span class="eyebrow small">Messaging</span>
            <h2>Inbox</h2>
          </div>
          <div class="top-actions">
            <button class="button secondary" id="new-message-btn">New chat</button>
          </div>
        </header>

        <div class="messages-layout">
          <aside class="glass-panel sidebar-panel">
            <div class="panel-header compact-header">
              <h3>Friends</h3>
              <button class="button ghost tiny" id="refresh-friends-btn">Refresh</button>
            </div>
            <div class="friend-list" id="friend-list"></div>
          </aside>

          <section class="glass-panel chat-panel">
            <div class="chat-header" id="chat-header">
              <div>
                <strong>Select a conversation</strong>
                <small>Choose a friend to begin</small>
              </div>
            </div>
            <div class="chat-thread" id="chat-thread"></div>
            <form id="message-form" class="composer" novalidate>
              <input id="message-input" type="text" maxlength="2000" placeholder="Type a message…" />
              <button type="button" class="button secondary" id="attach-file-btn">Attach</button>
              <button type="submit" class="button primary">Send</button>
            </form>
          </section>
        </div>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="app.html" class="mobile-item">🏠</a>
      <a href="messages.html" class="mobile-item active">💬</a>
      <a href="files.html" class="mobile-item">📁</a>
      <a href="community.html" class="mobile-item">🌐</a>
      <a href="settings.html" class="mobile-item">⚙️</a>
    </nav>

    <div id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/messages.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.MessageApp) {
          window.MessageApp.init();
        }
      });
    </script>
  </body>
</html>

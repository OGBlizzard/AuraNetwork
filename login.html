<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAÐØW Network | Login</title>
    <meta name="theme-color" content="#070b14" />
    <link rel="manifest" href="pwa/manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body class="auth-page">
    <div class="bg-glow glow-one"></div>
    <div class="bg-glow glow-two"></div>

    <main class="auth-shell">
      <section class="auth-panel glass-panel">
        <div class="brand-wrap centered">
          <div class="brand-mark">S</div>
          <div>
            <div class="brand-name">SHAÐØW</div>
            <div class="brand-subtitle">Network</div>
          </div>
        </div>

        <h1>Welcome back</h1>
        <p class="sub-copy">Sign in to your private network.</p>

        <form id="login-form" class="auth-form" novalidate>
          <label>
            <span>Email or username</span>
            <input type="text" name="identifier" placeholder="you@shadownetwork.example" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" placeholder="Enter your password" required />
          </label>

          <div class="row between compact">
            <label class="checkbox-row">
              <input type="checkbox" name="remember" />
              <span>Keep me signed in</span>
            </label>
            <a href="#" class="text-link">Forgot password?</a>
          </div>

          <button class="button primary large" type="submit">Log in</button>
        </form>

        <div class="auth-footer">
          <span>Need a new account?</span>
          <a href="register.html" class="text-link">Create one</a>
        </div>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.AuthHandler) {
          window.AuthHandler.initLogin();
        }
      });
    </script>
  </body>
</html>
